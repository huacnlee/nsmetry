# The public demo on GitHub Pages: the same web app a deployment serves, opened at `?demo`, where it signs in
# to the on-device demo server (app/demo.ts) and shows a year of made-up traffic for a small fleet of sites and
# apps. Nothing it shows comes from, or goes to, a server.
name: Demo

on:
  push:
    branches: [main]
    paths: ["app/**", "nsh.json", "nsh.lock", "src/world.ts", ".github/workflows/demo.yml", ".github/actions/setup-nsh/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          target: web
      - run: app/build-web.sh --build "$GITHUB_RUN_NUMBER"
      # Pages serves no headers of its own choosing and no precompressed copies: drop the .br/.gz files
      # (Pages compresses itself), and send `/` straight into the demo.
      - name: Prepare the site
        run: |
          site="$RUNNER_TEMP/site"
          cp -R app/dist/web/nsmetry "$site"
          find "$site" \( -name '*.br' -o -name '*.gz' -o -name '_headers' \) -delete
          sed -i 's|<head>|<head><script>if(!/[?\&]demo/.test(location.search))location.replace("?demo")</script>|' "$site/index.html"
          touch "$site/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
