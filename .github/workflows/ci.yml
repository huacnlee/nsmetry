name: CI

on:
  push:
    branches: [main]
  pull_request:

# Anyone taking an update should be able to see, at a glance, that the version
# they are about to deploy type-checks and passes its tests — including on the
# pull request the update workflow opens in their own copy. The suite runs
# inside the real Workers runtime via @cloudflare/vitest-pool-workers, so a pass
# here means the same code paths the Worker uses actually ran.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # One version, two files that have to agree: the constant the Worker
      # reports to the console and the manifest everything else reads. Drift
      # means an instance claiming to be on a release nobody ever tagged.
      - name: Version constant matches package.json
        run: |
          manifest=$(node -p "require('./package.json').version")
          constant=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/version.ts)
          if [ "$manifest" != "$constant" ]; then
            echo "package.json says $manifest, src/version.ts says $constant"
            exit 1
          fi

      # worker-configuration.d.ts is committed, so this only fails if it has
      # drifted from wrangler.jsonc — which is exactly when it should.
      - run: npm run typecheck

      # The budget test imports app/api.ts, whose tsconfig extends one `nsh check` generates
      # (app/.nsh/, not committed). This job has no nsh CLI, so give the transform an empty base.
      - name: Stub the NSH-generated tsconfig
        run: test -f app/.nsh/tsconfig.json || { mkdir -p app/.nsh && echo '{}' > app/.nsh/tsconfig.json; }

      - run: npm test

      # The JavaScript SDK (sdk/js) has its own Node suite.
      # No lockfile: its only dependencies are TypeScript and Vitest, for development.
      - run: npm install --no-audit --no-fund
        working-directory: sdk/js
      - run: npm run typecheck
        working-directory: sdk/js
      - run: npm test
        working-directory: sdk/js

  # The apps (app/) and the NSH SDK (sdk/nsh) with its example app: type-checked, built and tested by `nsh`
  # on the current NSH nightly, the same commit release.yml packages with, so an NSH change that breaks
  # the app shows up here instead of at release time.
  nsh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          target: linux
      - run: nsh check
      - run: nsh build
      - run: nsh test
      - run: nsh check
        working-directory: sdk/nsh/example
      - run: nsh build
        working-directory: sdk/nsh/example
      - run: nsh test
        working-directory: sdk/nsh/example
